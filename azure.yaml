# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: claryo-iot-dashboard
metadata:
  template: claryo-iot-dashboard@1.0.0
services:
  api:
    project: claryo-backend
    language: py
    host: appservice
  web:
    project: claryo-frontend
    language: js
    host: staticwebapp
    dist: build
hooks:
  postprovision:
    posix:
      shell: sh
      continueOnError: false
      interactive: false
      run: |
        api="$(azd env get-value API_BASE_URL)"
        echo "REACT_APP_API_URL=$api" > claryo-frontend/.env.production.local
        echo "Wrote claryo-frontend/.env.production.local -> $api"
    windows:
      shell: pwsh
      continueOnError: false
      interactive: false
      run: |
        $api = azd env get-value API_BASE_URL
        "REACT_APP_API_URL=$api" | Out-File -Encoding ascii -NoNewline claryo-frontend/.env.production.local
        Write-Host "Wrote claryo-frontend/.env.production.local -> $api"
