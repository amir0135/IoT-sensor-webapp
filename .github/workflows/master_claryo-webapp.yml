name: Build and deploy container app to Azure Web App - claryo-webapp

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository so that the workflow can access all files.
      - name: Checkout Code
        uses: actions/checkout@v2

      # 2. Set up the Python environment. This installs Python 3.9 so you can run tests and install dependencies.
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      # 3. Install dependencies from your requirements.txt file.
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run backend tests (if you have any). If your tests are located in claryo-backend/tests/, you can specify that path.
      - name: Run Backend Tests
        run: |
          pytest claryo-backend/tests --maxfail=1 --disable-warnings

      # 5. Run the sensor simulation test script from the claryo-backend/tests/ folder.
      - name: Run Sensor Simulation Test
        run: |
          python claryo-backend/tests/sensor_sim.py

      # 6. Build the Docker image for your backend using the Dockerfile in claryo-backend/.
      - name: Build Docker Image
        run: |
           docker build -f claryo-backend/Dockerfile -t claryo-backend:${{ github.sha }} .

      # 7. Log in to Azure Container Registry using the Docker login action (v3).
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: clarypocacr.azurecr.io
          username: ${{ secrets.AzureAppService_ContainerUsername_11c01914615a4776ba056411c443f45f }}
          password: ${{ secrets.AzureAppService_ContainerPassword_c93f8e964c1f426d824390cc794a2e13 }}

      # 8. Tag and push the Docker image to ACR.
      - name: Push Docker Image to ACR
        run: |
          docker tag claryo-backend:${{ github.sha }} clarypocacr.azurecr.io/claryo-backend:${{ github.sha }}
          docker push clarypocacr.azurecr.io/claryo-backend:${{ github.sha }}

      # 9. Deploy to Azure Web App using the Azure/webapps-deploy action.
      - name: Deploy to Azure Web App
        uses: Azure/webapps-deploy@v2
        with:
          app-name: claryo-webapp    # Replace with your actual App Service name
          slot-name: production
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_ce89ae6788754f18869ceb9269219386 }}
          images: clarypocacr.azurecr.io/claryo-backend:${{ github.sha }}
