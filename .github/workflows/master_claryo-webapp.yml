name: Build, Test, Scan, and Deploy Container App to Azure Web App - claryo-webapp

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:   # Enables manual triggering via the "Run workflow" button

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository.
      - name: Checkout Code
        uses: actions/checkout@v2

      # 2. Set up the Python environment (Python 3.9).
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      # 3. Install backend dependencies from claryo-backend/requirements.txt.
      - name: Install Dependencies
        working-directory: claryo-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run backend tests using pytest.
      - name: Run Backend Tests
        working-directory: claryo-backend
        run: |
          pytest --maxfail=1 --disable-warnings

      # 5. Run the sensor simulation test script.
      - name: Run Sensor Simulation Test
        working-directory: claryo-backend
        run: |
          python tests/sensor_sim.py

      # 6. Build the Docker image using the Dockerfile in claryo-backend/ with claryo-backend as build context.
      - name: Build Docker Image
        working-directory: claryo-backend
        run: |
          docker build -f Dockerfile -t claryo-backend:${{ github.sha }} .

      # 7. Run a security scan on the Docker image using Trivy.
      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@v0.10.0
        with:
          image: claryo-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: table

      # 8. Log in to Azure Container Registry (ACR) using the Docker login action.
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: clarypocacr.azurecr.io
          username: ${{ secrets.AzureAppService_ContainerUsername_11c01914615a4776ba056411c443f45f }}
          password: ${{ secrets.AzureAppService_ContainerPassword_c93f8e964c1f426d824390cc794a2e13 }}

      # 9. Tag and push the Docker image to your ACR.
      - name: Push Docker Image to ACR
        run: |
          docker tag claryo-backend:${{ github.sha }} clarypocacr.azurecr.io/claryo-backend:${{ github.sha }}
          docker push clarypocacr.azurecr.io/claryo-backend:${{ github.sha }}

      # 10. Deploy the container image to Azure Web App using the Azure/webapps-deploy action.
      - name: Deploy to Azure Web App
        uses: Azure/webapps-deploy@v2
        with:
          app-name: claryo-webapp
          slot-name: production
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_ce89ae6788754f18869ceb9269219386 }}
          images: clarypocacr.azurecr.io/claryo-backend:${{ github.sha }}

      # 11. Post-deployment: Wait for deployment stabilization and run a simple health check.
      - name: Post-Deployment Health Check
        run: |
          echo "Waiting 30 seconds for deployment to stabilize..."
          sleep 30
          # Replace the URL below with your actual app URL.
          curl -f https://claryo-webapp-b5bvckdyfbhddpcm.canadacentral-01.azurewebsites.net/ || { echo "Health check failed"; exit 1; }