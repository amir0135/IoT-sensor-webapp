name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests
        run: |
          pytest --maxfail=1 --disable-warnings

      # Run the sensor simulation test script
      - name: Run Sensor Simulation Test
        run: |
          python tests/sensor_sim.py

      - name: Build Docker Image
        run: |
          docker build -t claryo-backend:${{ github.sha }} .

      - name: Log in to Azure Container Registry
        uses: Azure/docker-login@v1.1.0
        with:
          login-server: <acr-name>.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push Docker Image to ACR
        run: |
          docker tag claryo-backend:${{ github.sha }} clarypocacr.azurecr.io/claryo-backend:${{ github.sha }}
          docker push <acr-name>.azurecr.io/claryo-backend:${{ github.sha }}

      - name: Deploy to Azure Web App
        uses: Azure/webapps-deploy@v2
        with:
          app-name: claryo-webapp
          slot-name: production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '<acr-name>.azurecr.io/claryo-backend:${{ github.sha }}'