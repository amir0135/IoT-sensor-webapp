name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      # 1. Checkout your repository.
      - name: Checkout Code
        uses: actions/checkout@v2

      # 2. Setup Node.js environment.
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # 3. Install dependencies and build the frontend.
      - name: Build Frontend
        working-directory: claryo-frontend
        run: |
          yarn install
          yarn build

      # 3.1. Debug: List contents of the build folder.
      - name: List Build Folder Contents
        working-directory: claryo-frontend/build
        run: ls -la

      # 4. Deploy to Azure Static Web Apps.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}  # For PR comments and GitHub integrations
          action: "upload"
          app_location: "claryo-frontend"   # Folder with your frontend source code.
          output_location: "build"          # Folder inside app_location containing your production build.
          api_location: ""                  # Explicitly indicate no API folder.
          skip_api_build: true              # Skip the API build step to avoid validation of a non-existent API folder.