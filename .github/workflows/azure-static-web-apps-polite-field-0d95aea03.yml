name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      # 1. Checkout your repository.
      - name: Checkout Code
        uses: actions/checkout@v2

      # 2. Setup Node.js environment.
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'

      # 3. Install dependencies and build the frontend.
      - name: Build Frontend
        working-directory: claryo-frontend
        run: |
          yarn install
          yarn build

      # 4. Deploy to Azure Static Web Apps.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}  # Used for PR comments and GitHub integrations
          action: "upload"
          app_location: "claryo-frontend"   # The folder where your frontend source code lives.
          output_location: "build"          # The folder containing your production build output.